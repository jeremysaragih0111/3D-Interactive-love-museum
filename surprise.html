<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Surprise — Love Museum</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .surprise-stage {
      display: grid; place-items: center;
      min-height: 60vh;
      text-align: center;
      padding: 20px;
    }
    .gift {
      width: clamp(160px, 30vw, 220px);
      aspect-ratio: 1;
      display: grid; place-items: center;
      font-size: clamp(80px, 18vw, 140px);
      color: var(--rose);
      filter: drop-shadow(0 0 30px rgba(255, 122, 168, 0.6));
      cursor: pointer;
      border: none;
      background: transparent;
      transition: transform 0.6s var(--ease), opacity 0.6s var(--ease);
      animation: floatY 5s ease-in-out infinite;
    }
    .gift:hover { transform: scale(1.06); }
    .gift:disabled { cursor: default; }
    .surprise-stage.is-opening .gift {
      transform: scale(1.3) rotate(8deg);
      opacity: 0;
    }
    .surprise-message {
      max-width: 680px;
      margin: 0 auto;
      padding: clamp(24px, 5vw, 44px);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1s var(--ease) 0.4s, transform 1s var(--ease) 0.4s;
    }
    .surprise-message.is-visible { opacity: 1; transform: translateY(0); }
    .surprise-signature {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--rose-soft);
      margin-top: 18px;
    }
    .burst-layer { pointer-events: none; position: fixed; inset: 0; z-index: 60; overflow: hidden; }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <canvas id="bg-particles" aria-hidden="true"></canvas>
  <div id="site-header"></div>

  <main id="main">
    <section class="section" aria-labelledby="s-heading">
      <p class="hero-eyebrow">Room VI</p>
      <h1 id="s-heading" class="section-title">A Secret Surprise</h1>
      <p class="section-sub" id="surprise-teaser">There's something waiting for you inside…</p>

      <div class="surprise-stage" id="surprise-stage">
        <button class="gift" id="gift-btn" aria-label="Open your surprise">
          <span aria-hidden="true">🎁</span>
        </button>
      </div>

      <article class="glass surprise-message" id="surprise-message" aria-live="polite">
        <h2 class="section-title" style="font-size: clamp(22px, 4vw, 32px);">For You</h2>
        <p id="surprise-text" style="font-family: var(--font-serif); font-size: clamp(18px, 2.4vw, 22px); line-height: 1.8; color: var(--cream);"></p>
        <p class="surprise-signature" id="surprise-signature"></p>
        <div class="mt-md">
          <button class="btn" id="replay-btn">Open It Again <span aria-hidden="true">↺</span></button>
        </div>
      </article>

      <div class="mt-lg center">
        <a class="btn btn-ghost" href="forever.html">Continue to Forever <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>

  <div class="burst-layer" id="burst-layer" aria-hidden="true"></div>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/background.js" defer></script>
  <script src="js/pages/surprise.js" defer></script>
</body>
</html>
