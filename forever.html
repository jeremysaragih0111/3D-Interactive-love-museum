<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forever — Love Museum</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .forever-hero {
      min-height: 80vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: clamp(40px, 8vw, 100px) 20px;
    }
    .forever-photo {
      width: min(560px, 90vw);
      aspect-ratio: 4/3;
      border-radius: var(--radius);
      overflow: hidden;
      margin: 0 auto 32px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 30px 80px rgba(255, 122, 168, 0.2);
      background: linear-gradient(135deg, rgba(255,122,168,0.2), rgba(107,63,160,0.2));
      display: grid; place-items: center;
    }
    .forever-photo img { width: 100%; height: 100%; object-fit: cover; }
    .forever-fallback { font-size: 96px; color: var(--rose); }
    .golden-glow {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(600px 300px at 50% 40%, rgba(232, 201, 138, 0.18), transparent 70%);
      z-index: -1;
    }
    .forever-message {
      max-width: 720px;
      margin: 0 auto;
      font-family: var(--font-serif);
      font-size: clamp(18px, 2.4vw, 22px);
      line-height: 1.9;
      color: var(--cream);
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <canvas id="bg-particles" aria-hidden="true"></canvas>
  <div id="site-header"></div>

  <main id="main">
    <section class="forever-hero" aria-labelledby="f-title">
      <div class="golden-glow" aria-hidden="true"></div>
      <div style="max-width: 900px;">
        <p class="hero-eyebrow">Room VII</p>
        <h1 id="f-title" class="hero-title" style="font-size: clamp(36px, 7vw, 76px);">And Our Story Continues…</h1>

        <figure class="forever-photo" aria-label="Our photo">
          <img id="forever-img" src="assets/images/forever.jpg" alt="Our photo together"
               onerror="this.style.display='none'; this.parentElement.querySelector('.forever-fallback').hidden=false;" />
          <div class="forever-fallback" hidden aria-hidden="true">♥</div>
        </figure>

        <p class="forever-message" id="forever-text"></p>

        <div class="mt-lg" style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
          <a class="btn" href="index.html">Replay Our Story <span aria-hidden="true">↺</span></a>
          <a class="btn btn-ghost" href="index.html">Back to Home</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/background.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const f = window.LOVE_CONFIG.forever;
      const t = document.getElementById("forever-text");
      if (t) t.textContent = f.message;
      const img = document.getElementById("forever-img");
      if (img) img.src = f.photo;
    });
  </script>
</body>
</html>
