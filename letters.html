<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Letters — Love Museum</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .letters-grid { display: grid; gap: 28px; margin-top: 24px; }
    .letter-card { padding: clamp(22px, 4vw, 40px); }
    .letter-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
    .letter-title { font-family: var(--font-serif); font-size: 26px; margin: 0; }
    .letter-teaser { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
    .letter-body-inner {
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px dashed rgba(255, 182, 207, 0.3);
      font-family: var(--font-serif);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.9;
      color: var(--cream);
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <canvas id="bg-particles" aria-hidden="true"></canvas>
  <div id="site-header"></div>

  <main id="main">
    <section class="section" aria-labelledby="l-heading">
      <p class="hero-eyebrow">Room IV</p>
      <h1 id="l-heading" class="section-title">Love Letters</h1>
      <p class="section-sub">Some words are too heavy for a moment — so they live here, waiting for you to open them.</p>

      <div class="letters-grid" id="letters-grid"></div>

      <div class="mt-lg center">
        <a class="btn" href="our-time.html">See Our Time <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/background.js" defer></script>
  <script src="js/pages/letters.js" defer></script>
</body>
</html>
