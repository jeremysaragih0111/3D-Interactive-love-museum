<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Timeline — Love Museum</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .timeline { position: relative; margin-top: 40px; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 22px; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, transparent, var(--rose), var(--purple), transparent);
      opacity: 0.5;
    }
    .tl-item { position: relative; padding-left: 64px; margin-bottom: 40px; }
    .tl-dot {
      position: absolute; left: 12px; top: 12px;
      width: 22px; height: 22px; border-radius: 50%;
      background: radial-gradient(circle, var(--rose), var(--purple));
      box-shadow: 0 0 0 6px rgba(255, 122, 168, 0.15), 0 0 24px rgba(255, 122, 168, 0.6);
    }
    .tl-card { padding: 22px; display: grid; gap: 14px; grid-template-columns: 1fr; }
    @media (min-width: 760px) {
      .tl-card { grid-template-columns: 220px 1fr; align-items: start; }
    }
    .tl-photo {
      aspect-ratio: 4/3; border-radius: 12px; overflow: hidden;
      background: linear-gradient(135deg, rgba(255,122,168,0.18), rgba(107,63,160,0.18));
      display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center;
    }
    .tl-photo img { width: 100%; height: 100%; object-fit: cover; }
    .tl-date { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--rose-soft); }
    .tl-title { font-family: var(--font-serif); font-size: 24px; margin: 4px 0 6px; }
    .tl-story { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <canvas id="bg-particles" aria-hidden="true"></canvas>
  <div id="site-header"></div>

  <main id="main">
    <section class="section" aria-labelledby="tl-heading">
      <p class="hero-eyebrow">Room II</p>
      <h1 id="tl-heading" class="section-title">Our Timeline</h1>
      <p class="section-sub">Every milestone we've collected — glowing quietly in the order we lived them.</p>

      <div class="timeline" id="timeline-list" aria-live="polite"></div>

      <div class="mt-lg center">
        <a class="btn" href="gallery.html">View Memory Gallery <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/background.js" defer></script>
  <script src="js/pages/timeline.js" defer></script>
</body>
</html>
